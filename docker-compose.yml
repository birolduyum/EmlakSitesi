# Görüntü sürümleri bilerek sabitlenmiştir (postgres, node ve nginx: web/Dockerfile). Yükseltmek için Docker Hub'da etiketin
# var olduğunu doğrulayıp birlikte değiştirin. PostgreSQL'de yalnızca 16.x yama sürümleri arasında geçin (veri klasörü uyumlu kalır).
services:
  db:
    restart: unless-stopped
    image: postgres:16.15
    environment:
      POSTGRES_DB: emlak
      POSTGRES_USER: emlak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emlak -d emlak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=emlak;Username=emlak;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlı olmalı}
      Users__0__Username: ${Users__0__Username}
      Users__0__Password: ${Users__0__Password}
      Users__0__Role: ${Users__0__Role}
      Users__1__Username: ${Users__1__Username}
      Users__1__Password: ${Users__1__Password}
      Users__1__Role: ${Users__1__Role}
      Users__2__Username: ${Users__2__Username}
      Users__2__Password: ${Users__2__Password}
      Users__2__Role: ${Users__2__Role}
      Advisor__Name: ${Advisor__Name}
      Advisor__Phone: ${Advisor__Phone}
      Advisor__WhatsApp: ${Advisor__WhatsApp}
      Seed__Sample: ${Seed__Sample:-true}
      # Giriş denemesi sınırı (istemci IP'si başına dakikada); aşılırsa 429 döner.
      RateLimit__LoginPerMinute: ${RateLimit__LoginPerMinute:-10}
      Photos__Path: /data/photos
    volumes:
      - photos:/data/photos
    # API yalnızca bu makineden erişilebilir (loopback); web kapsayıcısı API'ye compose ağı üzerinden (api:8080) ulaşır.
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  dbdata:
  photos:
