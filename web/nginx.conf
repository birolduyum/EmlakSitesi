server_tokens off;

# Gzip: metin tabanlı içerik
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fotoğraf yüklemesi için API de tek istekte en çok 100 MB kabul eder
    client_max_body_size 100m;

    # Güvenlik başlıkları (CSP dahil) tek dosyada; kendi add_header'ı olan location'larda yeniden include edilir.
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Fotoğraflar: API'nin kendi önbellek başlıkları aynen geçer
    location /photos/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Parmak izli (hash'li) dosyalar: bir yıl, değişmez
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # index.html her seferinde doğrulanır (SPA yedeği de buraya düşer, CSP buradan gider)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (derin bağlantılar: /ilan/1, /admin/giris)
    location / {
        try_files $uri /index.html;
    }
}
