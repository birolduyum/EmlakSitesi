# Güvenlik başlıkları: tek kaynak. nginx'te add_header, bir location kendi add_header'ını tanımlarsa devralınmaz;
# bu yüzden bu dosya server bloğuna ve kendi add_header'ı olan her location'a include edilir (nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# İçerik Güvenlik Politikası: yalnızca kendi kaynağımız. style-src 'unsafe-inline' Vue'nun satır içi :style bağlamaları içindir;
# script-src 'self' satır içi/üçüncü taraf betiği engeller (jeton localStorage'da olduğu için XSS'e karşı asıl katman budur).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
